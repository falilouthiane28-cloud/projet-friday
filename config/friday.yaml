# Configuration de Friday — phase 1 (Fondations)
# Les règles Tier 0 ne sont pas configurables (codées en dur).

app:
  name: FRIDAY
  master: Thaïne Fallou
  language: fr-FR
  soul_path: SOUL.md

logging:
  level: INFO          # DEBUG, INFO, WARNING, ERROR
  json: true

audit:
  db_path: data/audit.db

voice:
  # Binaire Swift (cd voice && swift build -c release)
  binary: voice/.build/release/friday-voice
  locale: fr-FR

brain:
  # claude-code : heure et date en local, le reste à Claude Code (outils Friday seulement, sous guardrails).
  # local : réponses locales seulement (hors ligne).
  engine: claude-code
  claude_binary: null    # null : PATH, ~/.claude/local, puis le binaire de l'app Claude
  model: sonnet
  memory_model: haiku    # extraction des faits durables après chaque échange (appel séparé, en tâche de fond)
  timeout_s: 60

tools:
  # Outils de Claude Code (serveur MCP de Friday), chacun soumis aux guardrails ci-dessous.
  default_city: Dakar    # ville de la météo par défaut ; null : Claude demande

home_assistant:
  # Domotique (phase 6) : API REST de Home Assistant. null : non configuré (Friday le dit).
  # Le jeton n'est JAMAIS ici : trousseau macOS, service ci-dessous, compte « friday » :
  #   security add-generic-password -U -s friday-home-assistant -a friday -w
  url: null              # ex. http://homeassistant.local:8123
  keychain_service: friday-home-assistant
  timeout_s: 5

conductor:
  # En dessous de ce score, l'intention retombe sur « conversation ».
  min_confidence: 0.3

guardrails:
  # Tier par action (1 = confirmation, 2 = notifier, 3 = auto + log, 4 = silencieux).
  # Le moteur applique toujours le tier le plus strict entre ce fichier et ses
  # planchers codés en dur : on peut durcir une action, jamais l'assouplir.
  # Action absente de cette liste → Tier 1 (fermé par défaut, codé en dur).
  actions:
    file.delete: 1
    file.move: 1
    message.send: 1
    payment.execute: 1
    reminder.create: 2
    calendar.create_event: 2
    home.secure: 1           # serrures, alarme, portes de garage, volets (plancher Tier 1 codé en dur)
    home.set_light: 2
    home.set_switch: 2       # prises et interrupteurs
    home.scene: 2            # scènes (refusées si elles touchent serrure, alarme ou volet)
    file.write: 2
    code.run: 2              # Codeur : Python en bac à sable (sans réseau ni dossier personnel)
    agent.delegate: 3        # délégation à un agent ; ses propres actions repassent par ces règles
    calendar.read: 3          # Planificateur : lecture de l'agenda (Calendrier macOS)
    home.read: 3             # état des appareils Home Assistant
    weather.read: 3
    web.search: 3
    web.read: 3
    system.read_metrics: 3
    file.read: 3
    memory.cache_check: 4
    memory.read: 4
  # Domaines vers lesquels un envoi sortant est permis (le reste est une exfiltration).
  allowed_domains:
    - api.anthropic.com
