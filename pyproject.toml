[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "Friday — assistant vocal personnel multi-agents (macOS Apple Silicon)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
